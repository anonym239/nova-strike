<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Slice</title>
</head>
<body>
<script type="module">
import { createGame } from '../../lib/shell.js';

const COLORS = ['#35e0ff', '#7dff9b', '#ffd27a', '#ff4fa3', '#b06bff'];
let items, parts, trail, lives, spawnT, combo, comboT, flash, prev;

// Abstand eines Punktes zur Strecke a–b (die "Klinge" zwischen zwei Frames)
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  const t = l2 ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2)) : 0;
  return Math.hypot(px - ax - dx * t, py - ay - dy * t);
}

createGame({
  title: 'Neon Slice',
  tagline: 'Zerschneide alles – nur nicht die Bomben',
  colors: ['#7dff9b', '#35e0ff'],
  bestKey: 'neonSliceBest',
  controls: [['🖐️', 'Hand schnell bewegen', 'zerschneidet Kristalle'], ['💣', 'Bomben meiden', 'rote Kugeln kosten ein Leben'], ['⚡', 'Combos', 'mehrere in einem Zug']],
  mouseHint: 'Maus-Modus: Maus schnell über die Kristalle ziehen',

  start(api) {
    items = []; parts = []; trail = []; lives = 3; spawnT = 1; combo = 0; comboT = 0; flash = 0;
    prev = { x: api.input.x, y: api.input.y };
  },

  update(dt, api) {
    const { W, H, U, input, rand } = api;
    const g = 1.1 * H;
    spawnT -= dt;
    if (spawnT <= 0) {
      const n = 1 + Math.floor(Math.random() * Math.min(3, 1 + api.t / 15));
      for (let i = 0; i < n; i++) {
        const x = rand(.15, .85) * W, bomb = api.t > 8 && Math.random() < .16;
        items.push({ x, y: H + 40 * U, vx: (W / 2 - x) * rand(.2, .7), vy: -rand(1.15, 1.42) * H, r: rand(30, 44) * U,
          rot: rand(0, 6), spin: rand(-3, 3), bomb, col: bomb ? '#ff3b3b' : COLORS[Math.floor(Math.random() * COLORS.length)], sides: 3 + Math.floor(Math.random() * 4) });
      }
      spawnT = Math.max(.55, 1.5 - api.t * .012);
    }

    const speed = Math.hypot(input.vx, input.vy), cutting = input.present && speed > 500 * U;
    trail.push({ x: input.x, y: input.y, life: .18, hot: cutting });
    for (const p of trail) p.life -= dt;
    trail = trail.filter(p => p.life > 0);
    comboT -= dt; if (comboT <= 0) combo = 0;
    flash = Math.max(0, flash - dt);

    for (const it of items) {
      it.vy += g * dt; it.x += it.vx * dt; it.y += it.vy * dt; it.rot += it.spin * dt;
      if (cutting && segDist(it.x, it.y, prev.x, prev.y, input.x, input.y) < it.r + 6 * U) {
        it.dead = true;
        for (let i = 0; i < (api.hi ? 22 : 12); i++) {
          const a = rand(0, 6.283), v = rand(80, 420) * U;
          parts.push({ x: it.x, y: it.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(.3, .7), col: it.col, s: rand(2, 5) * U });
        }
        if (it.bomb) { lives--; flash = .4; combo = 0; api.sfx(120, .5, 'sawtooth', .12, -80); }
        else { combo++; comboT = .6; api.score += 10 * combo; api.sfx(500 + combo * 70, .1, 'triangle', .06, 300); }
      } else if (it.y > H + 80 * U && it.vy > 0) {
        it.dead = true;
        if (!it.bomb) { lives--; flash = .25; api.sfx(180, .25, 'square', .06, -60); }
      }
    }
    items = items.filter(it => !it.dead);
    for (const p of parts) { p.vy += g * .5 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    parts = parts.filter(p => p.life > 0);
    prev = { x: input.x, y: input.y };
    if (lives <= 0) api.gameOver();
  },

  draw(ctx, api) {
    const { W, H, U, TAU } = api;
    for (const it of items) {
      ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot);
      if (api.hi) { ctx.shadowColor = it.col; ctx.shadowBlur = 18; }
      ctx.beginPath();
      if (it.bomb) ctx.arc(0, 0, it.r, 0, TAU);
      else for (let i = 0; i < it.sides; i++) { const a = i / it.sides * TAU; ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * it.r, Math.sin(a) * it.r); }
      ctx.closePath();
      ctx.fillStyle = it.bomb ? '#2a0508' : 'rgba(8,10,26,.9)'; ctx.fill();
      ctx.strokeStyle = it.col; ctx.lineWidth = 3 * U; ctx.stroke();
      ctx.restore();
      if (it.bomb) api.text('✕', it.x, it.y + 9 * U, 26 * U, '#ff3b3b');
    }
    ctx.globalCompositeOperation = 'lighter';
    for (const p of parts) { ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.col; ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); }
    ctx.globalAlpha = 1;
    // Klinge
    ctx.lineCap = 'round';
    for (let i = 1; i < trail.length; i++) {
      const a = trail[i - 1], b = trail[i];
      ctx.strokeStyle = b.hot ? '#eaffff' : 'rgba(120,200,255,.5)'; ctx.globalAlpha = b.life / .18; ctx.lineWidth = (b.hot ? 9 : 3) * U * (b.life / .18);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    if (api.input.present) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(api.input.x, api.input.y, 5 * U, 0, TAU); ctx.fill(); }

    for (let i = 0; i < 3; i++) api.text('♥', W - 30 * U - i * 34 * U, 46 * U, 30 * U, i < lives ? '#ff4fa3' : '#2b3350');
    if (combo > 1) api.text('COMBO ×' + combo, W / 2, 60 * U, 26 * U, '#ffd27a', 'center', 800);
    if (flash > 0) { ctx.fillStyle = `rgba(255,60,80,${flash})`; ctx.fillRect(0, 0, W, H); }
  },
});
</script>
</body>
</html>
